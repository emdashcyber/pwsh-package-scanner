name: Gallery research scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:
    inputs:
      refresh_advisories:
        description: Refresh OSV advisories during this run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gallery-research-scan
  cancel-in-progress: false

jobs:
  scan-and-build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install PowerShell 7.6.8
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/powershell-7.6.8-linux-x64.tar.gz"
          install_dir="$RUNNER_TEMP/pwsh-7.6.8"
          curl --fail --location --silent --show-error "https://github.com/PowerShell/PowerShell/releases/download/v7.6.8/powershell-7.6.8-linux-x64.tar.gz" --output "$archive"
          printf '%s  %s\n' '59112E38AD83350E4F6DC0195953C66B5926792F300CA2E7691B8242E7A16E7F' "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod +x "$install_dir/pwsh"
          echo "$install_dir" >> "$GITHUB_PATH"
          echo "PWSH_PATH=$install_dir/pwsh" >> "$GITHUB_ENV"
      - name: Install pinned static analyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modulePath = Join-Path $env:RUNNER_TEMP 'ps-modules'
          New-Item -ItemType Directory -Force -Path $modulePath | Out-Null
          Save-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Repository PSGallery -Path $modulePath -TrustRepository
          "PSSCRIPTANALYZER_MODULE_PATH=$modulePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PowerShell: $($PSVersionTable.PSVersion) · PSScriptAnalyzer: $((Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq '1.25.0' | Select-Object -First 1).Version)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - run: npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: Scan Gallery and write static API snapshot
        env:
          REFRESH_ADVISORIES: ${{ github.event.schedule == '43 23 * * *' || inputs.refresh_advisories }}
        run: npm run scan
      - run: npm run build --prefix site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: scan-and-build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
